default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  primary:
    <<: *default
    username: "<%= ENV.fetch('DATABASE_USERNAME', 'postgres') %>"
    password: "<%= ENV.fetch('DATABASE_PASSWORD', 'sekret') %>"
    host: "<%= ENV.fetch('DATABASE_HOSTNAME', 'localhost') %>"
    port: "<%= ENV.fetch('DATABASE_PORT', 5432) %>"
    database: "<%= ENV.fetch('DATABASE_NAME', 'diviner') %>"
  dor_services_read_only:
    <<: *default
    username: "<%= ENV.fetch('DOR_SERVICES_DATABASE_USERNAME', 'dor_services') %>"
    password: "<%= ENV.fetch('DOR_SERVICES_DATABASE_PASSWORD', 'sekret') %>"
    host: "<%= ENV.fetch('DOR_SERVICES_DATABASE_HOSTNAME', 'localhost') %>"
    port: "<%= ENV.fetch('DOR_SERVICES_DATABASE_PORT', 5433) %>"
    database: "<%= ENV.fetch('DOR_SERVICES_DATABASE_NAME', 'dor_services') %>"
    replica: true

test:
  primary:
    <<: *default
    username: "<%= ENV.fetch('DATABASE_USERNAME', 'postgres') %>"
    password: "<%= ENV.fetch('DATABASE_PASSWORD', 'sekret') %>"
    host: "<%= ENV.fetch('DATABASE_HOSTNAME', 'localhost') %>"
    port: "<%= ENV.fetch('DATABASE_PORT', 5432) %>"
    database: "<%= ENV.fetch('DATABASE_TEST_NAME', 'diviner_test') %>"
  dor_services_read_only:
    <<: *default
    username: "<%= ENV.fetch('DOR_SERVICES_DATABASE_TEST_USERNAME', 'postgres') %>"
    password: "<%= ENV.fetch('DOR_SERVICES_DATABASE_TEST_PASSWORD', 'sekret') %>"
    host: "<%= ENV.fetch('DOR_SERVICES_DATABASE_TEST_HOSTNAME', 'localhost') %>"
    port: "<%= ENV.fetch('DOR_SERVICES_DATABASE_TEST_PORT', 5432) %>"
    database: "<%= ENV.fetch('DOR_SERVICES_DATABASE_TEST_NAME', 'diviner_test') %>"
    replica: true
    database_tasks: false
